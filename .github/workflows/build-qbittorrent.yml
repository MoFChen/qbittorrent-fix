name: Build qBittorrent with latest libtorrent

on:
  workflow_dispatch:
    inputs:
      qbittorrent_tag:
        description: "qBittorrent tag，留空自动使用 latest stable，例如 release-5.2.3"
        required: false
        type: string

      libtorrent_tag:
        description: "libtorrent tag，留空自动使用 latest stable，例如 v2.1.1"
        required: false
        type: string

  # 每周自动检查一次新版本
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  packages: write

env:
  # 最终镜像名称：
  # ghcr.io/<github用户名>/qbittorrent
  IMAGE_BASENAME: qbittorrent

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 1. 获取 qBittorrent / libtorrent 最新稳定版
      # ------------------------------------------------------------
      - name: Resolve latest versions
        env:
          GH_TOKEN: ${{ github.token }}
          QBT_INPUT: ${{ inputs.qbittorrent_tag }}
          LT_INPUT: ${{ inputs.libtorrent_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${QBT_INPUT:-}" ]]; then
            QBT_TAG="${QBT_INPUT}"
          else
            QBT_TAG="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/qbittorrent/qBittorrent/releases/latest \
              | jq -r '.tag_name'
            )"
          fi

          if [[ -n "${LT_INPUT:-}" ]]; then
            LT_TAG="${LT_INPUT}"
          else
            LT_TAG="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/arvidn/libtorrent/releases/latest \
              | jq -r '.tag_name'
            )"
          fi

          QBT_VERSION="${QBT_TAG#release-}"
          LT_VERSION="${LT_TAG#v}"

          # v2.1.1 -> 2.1
          LT_SERIES="$(printf '%s' "${LT_VERSION}" | awk -F. '{print $1"."$2}')"

          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER}/${IMAGE_BASENAME}"

          echo "QBT_TAG=${QBT_TAG}" >> "${GITHUB_ENV}"
          echo "QBT_VERSION=${QBT_VERSION}" >> "${GITHUB_ENV}"

          echo "LT_TAG=${LT_TAG}" >> "${GITHUB_ENV}"
          echo "LT_VERSION=${LT_VERSION}" >> "${GITHUB_ENV}"
          echo "LT_SERIES=${LT_SERIES}" >> "${GITHUB_ENV}"

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"

          echo "================================================"
          echo "qBittorrent tag : ${QBT_TAG}"
          echo "qBittorrent     : ${QBT_VERSION}"
          echo "libtorrent tag  : ${LT_TAG}"
          echo "libtorrent      : ${LT_VERSION}"
          echo "libtorrent line : ${LT_SERIES}"
          echo "image           : ${IMAGE_NAME}"
          echo "================================================"

      # ------------------------------------------------------------
      # 2. 下载 userdocs 的静态构建脚本
      #
      # LinuxServer 目前也是使用这个项目生成的静态 binary。
      # ------------------------------------------------------------
      - name: Download qBittorrent static build system
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/userdocs/qbittorrent-nox-static/master/qbt-nox-static.bash \
            -o qbt-nox-static.bash

          chmod +x qbt-nox-static.bash

      # ------------------------------------------------------------
      # 3. 配置静态编译
      #
      # 重点：
      # qbt_qbittorrent_tag = latest qB release
      # qbt_libtorrent_tag  = latest libtorrent release
      # ------------------------------------------------------------
      - name: Configure static build
        shell: bash
        run: |
          set -euo pipefail

          cat > env.custom <<EOF
          qbt_revision_url=userdocs/qbittorrent-nox-static
          qbt_zlib_type=zlib

          qbt_skip_icu=no

          qbt_libtorrent_version=${LT_SERIES}
          qbt_libtorrent_tag=${LT_TAG}

          qbt_qbittorrent_tag=${QBT_TAG}

          qbt_qt_version=6
          qbt_build_tool=cmake

          qbt_build_dir=qbt-build

          qbt_cross_name=x86_64

          qbt_mcm_url=userdocs/musl-cross-make
          qbt_patches_url=userdocs/qbittorrent-nox-static

          qbt_workflow_files=yes

          qbt_linker_mold=yes
          qbt_build_debug=no
          qbt_optimise_strip=yes
          EOF

          echo "------ env.custom ------"
          cat env.custom
          echo "------------------------"

      # ------------------------------------------------------------
      # 4. 创建 Alpine 构建容器
      #
      # 直接使用 userdocs CI 使用的 container helper。
      # ------------------------------------------------------------
      - name: Create qBittorrent build container
        id: qbt_docker
        uses: userdocs/actions/qbt_docker@v1.0.7
        with:
          os_id: alpine
          os_version_id: edge
          additional_apps: "curl git"

      # ------------------------------------------------------------
      # 5. 安装构建依赖 / toolchain
      # ------------------------------------------------------------
      - name: Bootstrap build dependencies
        shell: bash
        run: |
          set -euo pipefail

          docker exec "${container_name}" \
            bash qbt-nox-static.bash bootstrap_deps

          docker exec "${container_name}" \
            bash qbt-nox-static.bash -bs-a

      # ------------------------------------------------------------
      # 6. 编译依赖
      # ------------------------------------------------------------
      - name: Build zlib
        run: |
          docker exec "${container_name}" \
            bash qbt-nox-static.bash zlib

      - name: Build ICU
        run: |
          docker exec "${container_name}" \
            bash qbt-nox-static.bash icu

      - name: Build OpenSSL
        run: |
          docker exec "${container_name}" \
            bash qbt-nox-static.bash openssl

      - name: Build Boost
        run: |
          docker exec "${container_name}" \
            bash qbt-nox-static.bash boost

      # ------------------------------------------------------------
      # 7. 编译 latest libtorrent
      # ------------------------------------------------------------
      - name: Build libtorrent
        run: |
          docker exec "${container_name}" \
            bash qbt-nox-static.bash libtorrent

      # ------------------------------------------------------------
      # 8. 编译 Qt6
      # ------------------------------------------------------------
      - name: Build Qt6
        run: |
          docker exec "${container_name}" \
            bash qbt-nox-static.bash qtbase

          docker exec "${container_name}" \
            bash qbt-nox-static.bash qttools

      # ------------------------------------------------------------
      # 9. 编译 latest qbittorrent-nox
      # ------------------------------------------------------------
      - name: Build qBittorrent
        run: |
          docker exec "${container_name}" \
            bash qbt-nox-static.bash qbittorrent

      # ------------------------------------------------------------
      # 10. 检查生成的 binary
      # ------------------------------------------------------------
      - name: Verify qbittorrent-nox
        shell: bash
        run: |
          set -euo pipefail

          BINARY="qbt-build/completed/qbittorrent-nox"

          test -s "${BINARY}"

          chmod +x "${BINARY}"

          echo "------ file ------"
          file "${BINARY}"

          echo
          echo "------ qBittorrent version ------"
          "${BINARY}" --version

          echo
          echo "------ sha256 ------"
          sha256sum "${BINARY}"

          echo
          echo "------ build metadata ------"
          find qbt-build \
            -name 'dependency-version.json' \
            -type f \
            -print \
            -exec cat {} \; \
            || true

      # ------------------------------------------------------------
      # 11. 顺便上传静态 binary 到 Actions Artifacts
      # ------------------------------------------------------------
      - name: Upload qbittorrent-nox artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-${{ env.QBT_VERSION }}-libtorrent-${{ env.LT_VERSION }}
          path: qbt-build/completed/qbittorrent-nox
          if-no-files-found: error

      # ------------------------------------------------------------
      # 12. 创建最终镜像 build context
      #
      # 核心就是：
      #
      # FROM lscr.io/linuxserver/qbittorrent:latest
      #
      # 然后直接覆盖：
      # /app/qbittorrent-nox
      # ------------------------------------------------------------
      - name: Prepare LinuxServer image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p image

          cp \
            qbt-build/completed/qbittorrent-nox \
            image/qbittorrent-nox

          chmod 0755 image/qbittorrent-nox

          cat > image/Dockerfile <<'EOF'
          FROM lscr.io/linuxserver/qbittorrent:latest

          ARG QBT_VERSION
          ARG LT_VERSION

          USER root

          # 先放到临时位置
          COPY qbittorrent-nox /tmp/qbittorrent-nox

          # 用编译的 binary 替换 LinuxServer 自带版本
          RUN set -eux; \
              chmod 0755 /tmp/qbittorrent-nox; \
              /tmp/qbittorrent-nox --version; \
              rm -f /app/qbittorrent-nox; \
              mv /tmp/qbittorrent-nox /app/qbittorrent-nox; \
              chmod 0755 /app/qbittorrent-nox

          LABEL org.opencontainers.image.title="LinuxServer qBittorrent with custom libtorrent"
          LABEL io.github.custom.qbittorrent.version="${QBT_VERSION}"
          LABEL io.github.custom.libtorrent.version="${LT_VERSION}"
          EOF

          echo "------ Dockerfile ------"
          cat image/Dockerfile

      # ------------------------------------------------------------
      # 13. 登录 GHCR
      # ------------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # 14. 基于 LinuxServer latest 构建 + 推送
      #
      # 输出：
      #
      # ghcr.io/user/qbittorrent:latest
      #
      # ghcr.io/user/qbittorrent:qbt-5.2.3-lt-2.1.1
      # ------------------------------------------------------------
      - name: Build and push final image
        shell: bash
        working-directory: image
        run: |
          set -euo pipefail

          VERSION_TAG="qbt-${QBT_VERSION}-lt-${LT_VERSION}"

          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --push \
            --provenance=true \
            --build-arg "QBT_VERSION=${QBT_VERSION}" \
            --build-arg "LT_VERSION=${LT_VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${VERSION_TAG}" \
            .

          echo "IMAGE_VERSION_TAG=${VERSION_TAG}" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # 15. 拉回镜像验证，确保 LinuxServer 内部 binary 已成功替换
      # ------------------------------------------------------------
      - name: Verify final image
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${IMAGE_NAME}:${IMAGE_VERSION_TAG}"

          echo "------ final container qBittorrent ------"

          docker run --rm \
            --entrypoint /app/qbittorrent-nox \
            "${IMAGE_NAME}:${IMAGE_VERSION_TAG}" \
            --version

          echo
          echo "Published:"
          echo "${IMAGE_NAME}:latest"
          echo "${IMAGE_NAME}:${IMAGE_VERSION_TAG}"

      # ------------------------------------------------------------
      # 16. Actions 页面显示摘要
      # ------------------------------------------------------------
      - name: Summary
        shell: bash
        run: |
          {
            echo "## qBittorrent custom image"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| qBittorrent | \`${QBT_VERSION}\` |"
            echo "| libtorrent | \`${LT_VERSION}\` |"
            echo "| Base image | \`lscr.io/linuxserver/qbittorrent:latest\` |"
            echo
            echo "### Images"
            echo
            echo "\`${IMAGE_NAME}:latest\`"
            echo
            echo "\`${IMAGE_NAME}:${IMAGE_VERSION_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
