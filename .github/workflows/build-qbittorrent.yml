name: Build qBittorrent image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  QBT_VERSION: "5.3.0beta1"
  LIBTORRENT_VERSION: "v2.1.1"

  BOOST_VERSION_MAJOR: "1"
  BOOST_VERSION_MINOR: "92"
  BOOST_VERSION_PATCH: "0"

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04

    steps:
      - name: Set image variables
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo "IMAGE_NAME=ghcr.io/${OWNER}/qbittorrent" >> "$GITHUB_ENV"

          echo "VERSION_TAG=5.3.0beta1-lt2.1.1" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # 1. 获取 qBittorrent 官方 Docker 构建项目
      # ----------------------------------------------------------
      - name: Clone official qBittorrent Docker repository
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/qbittorrent/docker-qbittorrent-nox.git \
            qbt-docker

      # ----------------------------------------------------------
      # 2. 使用官方 Dockerfile 构建：
      #
      # qBittorrent 5.3.0beta1
      # libtorrent 2.1.1
      #
      # 不使用 userdocs 静态构建系统。
      # ----------------------------------------------------------
      - name: Build official qbittorrent-nox
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --build-arg "QBT_VERSION=${QBT_VERSION}" \
            --build-arg "BOOST_VERSION_MAJOR=${BOOST_VERSION_MAJOR}" \
            --build-arg "BOOST_VERSION_MINOR=${BOOST_VERSION_MINOR}" \
            --build-arg "BOOST_VERSION_PATCH=${BOOST_VERSION_PATCH}" \
            --build-arg "LIBBT_VERSION=${LIBTORRENT_VERSION}" \
            --build-arg "LIBBT_CMAKE_FLAGS=-Ddeprecated-functions=ON -Dwebtorrent=ON" \
            --tag "local/qbittorrent-upstream:${VERSION_TAG}" \
            ./qbt-docker

      # ----------------------------------------------------------
      # 3. 测试官方编译结果
      # ----------------------------------------------------------
      - name: Verify upstream build
        shell: bash
        run: |
          set -euo pipefail

          echo "===== qBittorrent ====="

          docker run --rm \
            --entrypoint /usr/bin/qbittorrent-nox \
            "local/qbittorrent-upstream:${VERSION_TAG}" \
            --version

          echo
          echo "===== upstream SBOM ====="

          docker run --rm \
            --entrypoint /bin/cat \
            "local/qbittorrent-upstream:${VERSION_TAG}" \
            /sbom.txt

      # ----------------------------------------------------------
      # 4. 从官方构建镜像提取 qbittorrent-nox
      # ----------------------------------------------------------
      - name: Extract qbittorrent-nox
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-image

          CONTAINER_ID="$(
            docker create \
              "local/qbittorrent-upstream:${VERSION_TAG}"
          )"

          docker cp \
            "${CONTAINER_ID}:/usr/bin/qbittorrent-nox" \
            final-image/qbittorrent-nox

          docker cp \
            "${CONTAINER_ID}:/sbom.txt" \
            final-image/qbt-upstream-sbom.txt

          docker rm "${CONTAINER_ID}"

          chmod 0755 final-image/qbittorrent-nox

          ls -lh final-image

      # ----------------------------------------------------------
      # 5. 生成最终 LinuxServer Dockerfile
      #
      # LinuxServer 所有原有机制全部保留：
      #
      # /config
      # PUID / PGID
      # WEBUI_PORT
      # TORRENTING_PORT
      # s6
      #
      # 只换 qbittorrent-nox。
      # ----------------------------------------------------------
      - name: Generate LinuxServer Dockerfile
        shell: bash
        run: |
          set -euo pipefail

          cat > final-image/Dockerfile <<'EOF'
          FROM lscr.io/linuxserver/qbittorrent:latest

          # qBittorrent 官方 binary 不是 LinuxServer 原来那种
          # 完全静态的 userdocs binary，因此补齐运行时库。
          RUN apk add --no-cache \
              libcrypto3 \
              libssl3 \
              qt6-qtbase \
              qt6-qtbase-sqlite \
              zlib

          COPY --chmod=0755 \
              qbittorrent-nox \
              /app/qbittorrent-nox

          COPY \
              qbt-upstream-sbom.txt \
              /qbt-upstream-sbom.txt

          # 构建阶段直接验证程序和动态库。
          RUN set -eux; \
              /app/qbittorrent-nox --version; \
              ldd /app/qbittorrent-nox | tee /tmp/qbt-ldd.txt; \
              ! grep -q "not found" /tmp/qbt-ldd.txt
          EOF

          echo "================ Dockerfile ================"
          cat final-image/Dockerfile
          echo "============================================"

      # ----------------------------------------------------------
      # 6. 登录 GitHub Container Registry
      # ----------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 7. 构建最终 LinuxServer 镜像
      # ----------------------------------------------------------
      - name: Build final LinuxServer image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --tag "${IMAGE_NAME}:${VERSION_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            ./final-image

      # ----------------------------------------------------------
      # 8. 最终运行验证
      # ----------------------------------------------------------
      - name: Verify final image
        shell: bash
        run: |
          set -euo pipefail

          echo "===== final qBittorrent ====="

          docker run --rm \
            --entrypoint /app/qbittorrent-nox \
            "${IMAGE_NAME}:${VERSION_TAG}" \
            --version

          echo
          echo "===== compile-time SBOM ====="

          docker run --rm \
            --entrypoint /bin/cat \
            "${IMAGE_NAME}:${VERSION_TAG}" \
            /qbt-upstream-sbom.txt

      # ----------------------------------------------------------
      # 9. 上传 GHCR
      # ----------------------------------------------------------
      - name: Push image
        shell: bash
        run: |
          set -euo pipefail

          docker push "${IMAGE_NAME}:${VERSION_TAG}"
          docker push "${IMAGE_NAME}:latest"

      # ----------------------------------------------------------
      # 10. Summary
      # ----------------------------------------------------------
      - name: Job summary
        shell: bash
        run: |
          {
            echo "## qBittorrent custom LinuxServer image"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| qBittorrent | ${QBT_VERSION} |"
            echo "| libtorrent | ${LIBTORRENT_VERSION#v} |"
            echo "| Base | lscr.io/linuxserver/qbittorrent:latest |"
            echo
            echo "### Published images"
            echo
            echo "\`${IMAGE_NAME}:${VERSION_TAG}\`"
            echo
            echo "\`${IMAGE_NAME}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
